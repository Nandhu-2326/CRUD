<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        gap: 10px;
        /* overflow: hidden; */
      }
      td {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="d-flex flex-column" style="gap: 15px">
      <h1 class="h1 d-flex justify-content-center align-items-center"></h1>
      <label for="">Name</label>
      <input type="text" class="input_1 form-control" />
      <label for="">Age</label>
      <input type="text" class="input_2 form-control" />
      <div class="d-flex justify-content-center">
      <div class="Addbtn">
      <button
        class="btn fw-semibold btn-primary sub d-flex align-items-center justify-content-center"
        style="gap: 15px"
      >
        <ion-icon
          name="person-add-outline"
          class="fw-bold"
          style="font-size: 20px"
        ></ion-icon>
        Add Member
      </button>
      </div>
      <div style="display: none" class="update">
        <button
          class="btn fw-semibold btn-success d-flex align-items-center justify-content-center"
          style="gap: 15px"
        >
          <ion-icon
            name="person-add-outline"
            class="fw-bold"
            style="font-size: 20px"
          ></ion-icon>
          Update Member
        </button>
      </div>
      </div>
      <br />
      <div class="table-responsive">
        <table class="table table-bordered table-hover table-striped">
          <tr class="table-primary">
            <th>Name</th>
            <th>Age</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
          <tbody class="result"></tbody>
        </table>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"
  ></script>
  <script type="module" src="index.js"></script>
  <script
    type="module"
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
  ></script>
  <script
    nomodule
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
  ></script>
</html>
